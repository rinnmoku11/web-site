<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>居酒屋 ゆう</title>
<link rel="stylesheet" href="style.css">    
</head>

<body>
    <header class="hero">
    <div class="hero-content">
        <p>鹿児島の居酒屋</p>
        <h1>居酒屋 ゆう</h1>
        <p>こだわりの料理とお酒を、ゆっくり楽しむ。</p>
        <button onclick="openReservation()">予約する</button>
    </div>
</header>

    <h2>お店について</h2>

    <p>
        居酒屋ゆうでは、地元の食材を使った料理と
        豊富なお酒を楽しんでいただけます。
    </p>

    <h2>おすすめメニュー</h2>

   <div class="menu-list">
    <div class="menu-card">
    <img src="menu1.jpg" alt="地鶏の炭火焼き">
    <h3>地鶏の炭火焼き</h3>
    <p>980円</p>
</div>

    <div class="menu-card">
        <h3>刺身盛り合わせ</h3>
        <p>1,280円</p>
    </div>

    <div class="menu-card">
        <h3>だし巻き卵</h3>
        <p>580円</p>
    </div>

    <div class="menu-card">
        <h3>生ビール</h3>
        <p>550円</p>
    </div>
</div>

    <h2>営業時間</h2>

    <p>17:00〜24:00</p>

    <h2>アクセス</h2>

    <p>鹿児島市○○町1-2-3</p>

    <button onclick="openReservation()">予約する</button>
<div id="reservation-modal" class="modal">
    <div class="reservation-form">
        <button class="close-button" onclick="closeReservation()">×</button>

        <h2>予約フォーム</h2>

        <form onsubmit="submitReservation(event)">
            <label>お名前</label>
            <input type="text" id="name" required>

            <label>電話番号</label>
            <input type="tel" id="phone" required>

            <label>予約日</label>
            <input type="date" id="date" required>

            <label>予約時間</label>
            <input type="time" id="time" required>

            <label>人数</label>
            <select id="people" required>
                <option value="">選択してください</option>
                <option value="1名">1名</option>
                <option value="2名">2名</option>
                <option value="3名">3名</option>
                <option value="4名">4名</option>
                <option value="5名">5名</option>
                <option value="6名">6名</option>
                <option value="7名">7名</option>
                <option value="8名">8名</option>
            </select>

            <label>備考</label>
            <textarea id="message" placeholder="アレルギーなどがあれば入力してください"></textarea>

            <button type="submit" class="submit-button">
                予約内容を確認
            </button>
        </form>
    </div>
</div>

<script src="script.js"></script>
</body>

</html>
